name: CI full

# Full tier (CraigHutchinson/.github docs/ci-strategy.md): `ctest --preset full`, every test, on Linux GCC and Clang, and on Windows with
# MinGW-w64 UCRT, the toolchain Sub0Squad (the library's first consumer) builds it with on Windows. The shared MSVC leg is off: the library
# is built with GCC-style flags (-Wall -Wextra -Werror). No macOS leg yet (not verified there). Triggers: release tags (a v0.2.x tag is the
# release check before Sub0Squad's pin moves), manual dispatch, a pull request labelled ci:full, and a weekly run that is skipped when main
# has not changed since the last successful full run. Honours CI_MODE (off | smoke | full) and ci:skip.

on:
  push:
    tags: ['v*', 'milestone/*']
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  schedule:
    - cron: '41 5 * * 1'

concurrency:
  group: ci-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Runs only with a ci:full label on pull requests; the schedule only when main changed; never while CI is off.
    uses: CraigHutchinson/.github/.github/workflows/change-gate.yml@789478c64113b201e518810a3ef6fbf1bf1b1b90
    with:
      full-workflow-file: ci-full.yml
    permissions: { contents: read, actions: read }

  full:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: CraigHutchinson/.github/.github/workflows/cpp-full.yml@789478c64113b201e518810a3ef6fbf1bf1b1b90
    with:
      cpm-cache-key-files: CMakeLists.txt cmake/get_cpm.cmake
      windows: false
      macos: false
      timeout-minutes: 30
    permissions: { contents: read, statuses: write, actions: read, pull-requests: read, checks: read }

  # The Windows leg: MinGW-w64 UCRT from MSYS2.
  windows-mingw:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: windows (MinGW-w64 UCRT)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit   # git and node from the runner stay on PATH (the viewer's tests need node)
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Key the dependency cache on the pins
        id: keys
        shell: bash
        run: echo "cpm=$(cat CMakeLists.txt cmake/get_cpm.cmake | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-mingw-${{ steps.keys.outputs.cpm }}
          restore-keys: cpm-mingw-
      - name: Configure
        run: cmake --preset default -G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc
      - run: cmake --build --preset default
      - name: Test (full tier)
        run: ctest --preset full --timeout 600

  # Reports ci/policy for pull requests once every job above has finished (no waiting on a billed runner).
  policy:
    needs: [full, windows-mingw]
    if: ${{ always() && github.event_name == 'pull_request' }}
    uses: CraigHutchinson/.github/.github/workflows/ci-policy.yml@789478c64113b201e518810a3ef6fbf1bf1b1b90
    with:
      upstream-result: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
    permissions: { contents: read, statuses: write, checks: read }
